<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>MediLink — Móvil</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body data-mode="mobile">

  <!-- Marco de celular: se ve como teléfono aunque se abra en una PC -->
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="phone-status"><span>9:41</span><span style="display:flex;align-items:center;gap:5px;"><svg viewBox="0 0 24 24" style="width:14px;height:14px;" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.5a16 16 0 0 1 20 0M5.5 12a11 11 0 0 1 13 0M9 15.5a6 6 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg><svg viewBox="0 0 24 24" style="width:18px;height:18px;" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4" stroke-linecap="round"/><rect x="4" y="9" width="13" height="6" rx="1" fill="currentColor" stroke="none"/></svg></span></div>

      <div class="phone-scroll">
        <section id="view-inicio" class="view active"><div id="home-content"></div></section>
        <section id="view-buscar" class="view">
          <p class="h-title">Encontrá tu profesional</p>
          <p class="h-sub">Elegí a quién querés consultar</p>
          <div class="search-panel">
          <label class="search-bar" for="search-input" style="margin-top:14px;"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="search-input" type="search" placeholder="Nombre, especialidad o ciudad" oninput="renderProfessionals()"></label>
          <div class="filter-row">
            <div class="chip-row" id="chip-row"></div>
            <label class="filter-control">Ciudad<select class="sel" id="city-select" onchange="renderProfessionals()"></select></label>
            <label class="filter-control">Centro<select class="sel" id="hosp-select" onchange="activeHosp=this.value;renderProfessionals()"></select></label>
            <label class="filter-control">Valoración<select class="sel" id="rating-select" onchange="renderProfessionals()"><option value="0">Cualquiera</option><option value="4">4 o más</option><option value="4.5">4,5 o más</option></select></label>
            <label class="filter-control">Disponibilidad<select class="sel" id="availability-select" onchange="renderProfessionals()"><option value="any">Cualquier fecha</option><option value="available">Con horarios disponibles</option></select></label>
            <label class="filter-control">Ordenar<select class="sel" id="sort-select" onchange="renderProfessionals()">
              <option value="rating">Mejor valorados</option>
              <option value="count">Más opiniones</option>
              <option value="name">Nombre A-Z</option>
            </select></label>
          </div>
          </div>
          <p class="result-count" id="result-count"></p>
          <div class="prof-list" id="prof-list"></div>
        </section>
        <section id="view-turnos" class="view">
          <p class="h-title">Mis turnos</p>
          <p class="h-sub">Consultá tus solicitudes y próximas consultas</p>
          <div id="appointments-list" class="appointments-list" style="margin-top:16px;"></div>
        </section>
        <section id="view-ranking" class="view">
          <p class="h-title">Ranking de profesionales</p>
          <p class="h-sub">Ordenados según las opiniones de los pacientes</p>
          <div class="prof-list" id="rank-list" style="margin-top:16px;"></div>
        </section>
        <section id="view-centros" class="view">
          <p class="h-title">Hospitales y centros de atención</p>
          <p class="h-sub">Teléfonos y horarios para sacar turno</p>
          <div class="hosp-grid" id="centros-list" style="margin-top:16px;"></div>
        </section>
        <section id="view-perfil" class="view"></section>
      </div>

      <!-- Barra de navegación inferior -->
      <nav class="bottomnav">
      <button class="bn-item active" data-view="inicio" onclick="go('inicio')"></button>
      <button class="bn-item" data-view="buscar" onclick="go('buscar')"></button>
      <button class="bn-item" data-view="turnos" onclick="go('turnos')"></button>
      <button class="bn-item" data-view="ranking" onclick="go('ranking')"></button>
      <button class="bn-item" data-view="centros" onclick="go('centros')"></button>
      </nav>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <!-- Orden importante: datos (generados desde la base) -> íconos -> auxiliares -> pantallas -> arranque -->
  <script src="../shared/js/data.js"></script>
  <script src="../shared/js/icons.js"></script>
  <script src="../shared/js/helpers.js"></script>
  <script src="../shared/js/views.js"></script>
  <script src="../shared/js/app.js"></script>
</body>
</html>
