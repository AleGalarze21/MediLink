<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediLink</title>
  <link rel="stylesheet" href="shared/css/base.css">
  <style>
    body { display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; }
    .box { max-width:560px; width:100%; text-align:center; }
    .box img { width:260px; max-width:70%; margin-bottom:8px; }
    .links { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:24px; }
    .links a { text-decoration:none; background:var(--surface); border-radius:20px; padding:22px 14px; box-shadow:var(--shadow); font-weight:800; }
    .links a small { display:block; color:var(--text-2); font-weight:500; margin-top:4px; }
    .links a:hover { outline:2px solid var(--green); }
    @media (max-width:420px){ .links { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="box">
    <img src="shared/img/logo.png" alt="MediLink — Conectando tu salud">
    <p class="h-sub">Plataforma de búsqueda y valoración de profesionales de la salud</p>
    <div class="links">
      <a href="web/index.html">Versión web<small>Para computadora</small></a>
      <a href="mobile/index.html">Versión móvil<small>Se ve como celular</small></a>
    </div>
  </div>
</body>
</html>
